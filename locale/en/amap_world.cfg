world_name_info_1=Classic map with mountainous terrain, treasure spawns 1.5x more frequently than other maps, and damage is not reduced by biters.
world_name_info_2=Main world features 4 planetary terrains simultaneously, starting base contains 4x 1M ore patches,\n and outdoor assemblers spawn 2x more frequently than other maps.
world_name_info_3=Island map, advantageous for defense. Placing vehicles next to water upgrades them to fishing boats.\n[Island System]\nThe map has 5 types of islands: Military Island, Industrial Island, Resource Island, Technology Island, Construction Island.\n- Buy Islands: Spend coins to purchase islands, islands automatically produce items and gain coins and experience based on investment ratio\n- Upgrade Islands: Spend coins to upgrade islands, increase investment and improve production efficiency and rewards\n- Island Rotation: Islands spawn in the order Military→Industrial→Resource→Technology→Construction, ensuring each island type is evenly distributed
world_name_info_6=Massive experience and gold bonuses, large amounts of EXP and gold awarded every 25 waves,\n gain one talent every 15 levels, vehicle interior space is 2x larger than other worlds and includes a linked chest.\n All assemblers are automatically enabled at start. Extremely difficult to build, fierce biter attacks.
world_name_info_7=Drive spider through 5 major planetary zones to escape biter pursuit, start with spider instead of rocket silo, each player has 1 linked chest.\n Supply points appear at regular intervals, use vehicles to travel between main world and other dimensions.
world_name_info_8=Every 90 minutes, you and your base are teleported to another planet, start with spider instead of rocket silo, limited map size, all shop levels unlocked at start. Biter nests on this map continuously regenerate.\n Use vehicles to travel between main world and other dimensions.
world_name_info_9=Biters only attack from above and build forts to assault your base. All ores generate regularly below the rocket silo, while biters occupy all outdoor resources that you must reclaim!\n Note: Biters on this map launch nuclear missiles to attack rocket silos.
world_name_info_10=Command your army, increase our morale through technology research to resist Cao Caos forces. Weaken enemy attacks by destroying enemy barracks.\n Cao Caos main forces only attack from above, but sometimes build barracks behind us.
world_name_info_11=Highly developed city with complete defense line and energy network system. Starts with defenses. When energy network is active, laser turrets have infinite damage and power, and wont lose health. Autonomous heavy artillery defense system automatically charges and destroys enemy fortresses. Recycler can convert any items into energy for the energy network!
world_name_info_12=You have been forced into a desperate situation surrounded by water on three sides by the bugs, erupting with amazing fighting will. In this map, you start with +1 talent, and can automatically research technology by killing bugs. After discovering the port (researching yellow science), you can unlock new planet terrain.
world_name_info_13=Drive a train through 5 major planetary zones
world_name_info_14=Start on Gleba, Earth and Gleba terrain swapped. Rocket silo and space platform techs unlocked at start. Main planet auto-fills 1 rocket part every 30s. Stone walls banned on space platforms! Start with only fish, solar panels, asteroid collectors and crushers, no weapons or ammo.
world_name_info_15=This is an underground world shrouded in eternal night, where only the spawn is an absolutely safe stronghold and lamps are your lifeline for pushing outward. Digging through the stone paths and finding lakes is the top priority early on; mining can uncover alien ore fragments that make your expansion twice as effective, and 10M ore veins that back you up in the late game; blowing up an explosives crate devours the darkness and expands your territory; digging yields treasure chests, and the wilds offer free assemblers and markets whose advanced buildings and materials make your expansion faster and steadier. Being out in the field is the most dangerous thing of all - cave guardians will surge out of the darkness; and in the mid-game authority fortresses appear to block your expansion, so destroy them in time! Dark Cave has set you a high-value 14400-tech clear as its goal - we believe you can build a vast underground base and ultimately reach it! Begin your journey into the dark, factory managers of Tank Defense!
world_name_info_16=A fortress at 100-wave strength spawns at a random point 150m from spawn at the start, then at least one every 30 minutes (one per 100 waves, counted within that 30-minute interval — both share one clock, no duplicates). Biters attack exclusively from fortresses, concentrating their assault every 50 waves (otherwise they only stockpile threat, no spawning). Clearing it grants a movement speed bonus (inherited from the former Dimensional Escape), and it counts toward the world clear challenge (one of the worlds required for the ultimate reward).
world_name_info_17=The wilderness is barren: no ores, no trees, no wild nests. Every resource is sealed inside randomly scattered "grid cells". Each cell has a 64x64 clear interior, ringed by two layers of deep water, with one random side made of shallow water (both people and vehicles can cross it - it is the only entrance). Your spawn is your home cell, holding iron/copper/coal/stone at 250K each. The tile a cell is paved with tells you what it will yield: grass = Earth ores, volcanic rock = calcite/tungsten/sulfuric acid geyser, electromagnetic rock = scrap, Yumako soil = Gleba trees. Each cell holds 3 nests and 6 worms; wipe out every nest to cash in the resource (1M for solid ores, 4 oil wells, 6 geysers, 200-300 Gleba trees), and 4 new nests will spawn just outside the cell. The farther the cell, the rarer the payout. Fortresses never land on a grid cell. Recycling and agriculture techs are unlocked at start, and landfill is allowed. Clear reward: higher follower robot count limit.
world_name_info_21=[Terrain] A central 288x288 home base (default random ores + 4x 40x40 mega ore patches of 4M each); when a new science pack tech is researched it expands 16 tiles left, right and down. Above it, a 384x128 Defense Channel (volcanic rock with lava patches) leads to the Bug-Hive Channel, which is an inverted trapezoid (cone opening upward): both side edges widen 45° with depth, Earth grassland inside, lava outside, and 40-tile dark voids flanking the junction. \n[Bug-Hive Channel] Bugs/nests spawn with the Chibi (world 10) rules (1/60 per tile); square ore chunks are forbidden inside; at 256 tiles above the channel start a lightning line spans the entire x-axis - beyond it lies the Death Zone, where players lose 1/3 of their max health every second until death; no wild markets spawn beyond the lightning line. \n[Resources] At spawn, a legendary big mining drill + legendary red chest: any biter killed has a 1/60 chance to drop 1 calcite into the chest (the drill needs no player power); only the spawn market sells calcite permanently (1 stack / 200 gold, no other market sells it). \n[Combat] Biters only march down the channel from above; flame towers are disabled; every ~35 minutes one fortress spawns south of the base (never overlapping thanks to the shared placement search); once 4 or more fortresses stand, an enemy nuke silo appears (fires a rocket every 3 minutes) - destroy all fortresses to make the silo vulnerable. \n[Growth] Research costs 2x; Foundations cost a flat 44 gold; the spawn market sells Mech Armor (69k), Foundries (5000g), tiered Legendary Beacons and calcite (1 stack / 200 gold); inside the Bug-Hive Channel (below the lightning line) market chunks spawn at double rate and every market there sells tier-1/2/3 items at 1x/2x/5x prices; when a player has slain 9999 worms cumulatively, an announcement is made, a Lucky Streak steel chest (1000-magic tier: Rare <500 waves / Epic 500-2000 / Legendary >2000) appears next to them, and the base expands 2 tiles down; from wave 1, every 20 minutes a Demolisher (<1000 small / 1000-2000 medium / >2000 big) spawns at a random spot inside the Bug-Hive Channel (below the lightning line, above the channel bottom), roams the Bug-Hive Channel only (pulled back to its spawn point if it approaches the Defense Channel top - it can never enter it), never despawns on its own until slain or replaced by the next spawn - killing it grants everyone halved coins and Engineer Foundations plus bonus coins to the killer, and spawns a single indestructible, minable Rare Lucky Streak steel chest (500/750/1000 magic for small/medium/big) at the kill spot; +1 talent every 45 RPG levels (tied to science packs), cap 60; molten casting unlocked at start; landfill unlocks after yellow science. \n[Clear reward] After clearing (1500 waves), each new map has a 20% chance to grant everyone 1 Foundry, +10% per extra 500 waves of your best record.
world_name_info_19=A narrow canyon full of rocks: a 192-tile strip of normal terrain in the middle, 192 tiles of dense rock on each side (4x the valley density, ores hidden under the rocks, only within 1472 tiles above/below the center), and impassable black void beyond, with unlimited height. Biters attack from above and below; the first wave comes after 3900s, and after wave 2000 the wave interval grows +2% per 100 waves (up to +30% at wave 3500). Indestructible uncommon roboports (aligned on a single horizontal line, no built-in power - connect your own electric poles) are auto-built every 46 tiles along the central axis to form a robot backbone — mine through the rocks to expand your base. Talents: +1 per 45 RPG levels; the first research of a tech containing green/gray/blue/purple/yellow/white packs grants +1 each, orange/pink/grass +2, indigo +3, black +5 (90k gold pool, not counted toward the purchase limit, same as Top Talent); max 60 talents per player. Iron/copper/stone/coal/oil at 4/4/4 frequency/size/richness, uranium at 3/3/3; mining speed +200%, +30 inventory slots (60 total), everyone starts with Rare Lucky Streak; no free wild assemblers outside spawn; landfill unlocks after yellow science; 1 flame tower max; legendary wooden chests disabled. Clearing 1500 waves grants +5 legendary construction robots in starting items, +1 more every 500 waves (applies to all maps).

