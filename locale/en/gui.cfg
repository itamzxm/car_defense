[gui-description]
spectator_mode=Toggles zoom-to-world view noise effect.\nEnvironmental sounds will be based on map view.
auto_hotbar=Automatically fills your hotbar with placeable items.
notify_on_polls=Receive a message when new polls are created and popup the poll.
position_top=On = Buttons move to top bar.\nOff = Buttons shown in bottom frame.
position_bottom=Toggle to select if you want the bottom button on the left side or the right side.
position_middle=Toggle to select if you want the bottom button above the quickbar or the side of the quickbar.
position_portable=Toggle to select if you want the bottom button to be portable or not.
blueprint_library=Toggles the usage of blueprint strings and the library.
gui_data_cleaning=Toggles the Gui data cleaning.
spaghett_mode=Disables the Logistic System research.\nRequester, buffer or active-provider containers can not be built.
antigrief=Toggle antigrief function.
team_balancing=Players can only join a team that has less or equal players than the opposing.
admin_vote=Only admins can vote for map difficulty. Clears all currently existing votes.
inventory_fullness=On = Enables inventory fullness.\nOff = Disables inventory fullness.
offline_players=On = Enables offline player inventory drop.\nOff = Disables offline player inventory drop.
collapse=On = Enables collapse after wave 100.\nOff = Disables collapse - you must breach the first zone for collapse to occur.
spill_ores=On = Enables ore spillage to surface when mining.\nOff = Disables ore spillage to surface when mining.
void_tiles=On = Changes the tiles to out-of-map.\nOff = Changes the tiles to lab-dark-2
market_purchase=On = Allows only trusted people to buy car/tanks.\nOff = Allows everyone to buy car/tanks.
deconstruct=On = Allows decon on car/tanks/trains.\nOff = Disables decon on car/tanks/trains.
wintery_mode=On = Enables wintery mode.\nOff = Disables wintery mode.
# ── Player List ──
show_all_players=On = Shows all players.\nOff = Shows only connected players.
# ── Poll ──
poll_create_mode=Disables non-trusted plebs to create polls.
poll_vote_mode=Disables non-trusted plebs to vote on polls.
poll_edit_tooltip=Edit Poll.
poll_trusted_tooltip=Sorry, you need to be trusted to create polls.
poll_duration_tooltip=Pro tip: Use mouse wheel or arrow keys for more fine control.
poll_delete_answer_tooltip=Delete answer field.
poll_button_tooltip=Let your question be heard!
poll_needs_question=Sorry, the poll needs a question.
poll_needs_answer=Sorry, the poll needs at least one answer.
