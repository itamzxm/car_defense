description=Car Defense - A Hardcore RPG Survival Adventure Across 12 Unique Worlds\n\n[Core Mechanics]\nOne Vehicle, One Life: Your vehicle is not just transport — it is the last bastion of civilization. As both your base and your life, it must be defended against relentless evolutionary threats. When all vehicles are destroyed, the game fails! Upon death, you respawn at your vehicle.\n\n[Ultimate Goal]\nConquer all 12 worlds and survive 4000 waves!\n\n[World Features]\nWorld 1 [Valley]: Mountainous terrain, 1.5x treasure spawn rate, biter damage does not decay\nWorld 2 [Four Seasons]: 4 planetary terrains coexist, starts with 4x 1M ore patches, 2x wild assembler spawn rate\nWorld 3 [Water World]: Island map, vehicles placed beside deep water automatically become fishing boats, harvest 2 fish every 30 seconds\nWorld 6 [Imperial Arena]: Earn 5K gold + 200 XP every 25 waves, vehicle space doubled, includes linked chests, all assemblers auto-activated at start\nWorld 7 [Dimensional Escape]: Begin with a Spidertron, navigate five planetary zones with supply points along the way\nWorld 8 [Dimensional Space]: Every 45 minutes, your base teleports to a new planet, starts with spider, limited map size, all shop levels unlocked at start, biter nests continuously respawn\nWorld 9 [Yanmen Pass]: Biters attack only from above and build fortresses, will launch nuclear missiles at rocket silos, occupy all wild resources\nWorld 10 [Battle of Red Cliffs]: Command your army in military-style combat, research "Morale" tech and destroy enemy barracks to weaken attacks\nWorld 11 [Lost City]: Features a complete defense line and Energy Grid system. When Energy Grid is active, laser turrets have infinite damage and infinite power, and take no damage. Autonomous heavy artillery automatically charges to destroy enemy fortresses. Recycling boxes can convert any item into Energy Grid power!\nWorld 12 [Last Stand]: Forced into a desperate three-sided water trap, unleashing amazing combat will. Start with +1 talent and automatically research technology by killing biters. Discover port (research yellow science) to unlock new planet terrain.\n\n[RPG & Class System]\nFour Core Attributes: Strength (STR), Agility (AGI), Magic (MAG), Vitality (VIT)\nThree Classes: Warrior (☆☆☆), Mage (☆☆☆☆☆), Builder (☆)\n\n[Installation Instructions]\nDownload scenario folder, place it in: %AppData%\\Roaming\\Factorio\\scenarios\\\nLaunch Factorio → Multiplayer → Host Saved Game → Scenarios → Select Car Defense\n\nMap Author: itam\nCommunity & Support: QQ Group 701077913


