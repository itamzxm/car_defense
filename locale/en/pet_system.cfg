help_title=Pet System Guide
help_text=[Getting Pets]\n1. Buy pet eggs (Low/Mid/High) from the shop for random quality small bugs\n2. First time magicka reaches 50: receive a free Small Biter\n3. Maximum 3 pets per player\n\n[Evolution]\nPets auto-evolve to the next form when reaching the required level. Only the form changes, all other stats remain.\nEvolution levels (by pet level):\nSmall->Medium: Lv.20 (Biter/Spitter) / Lv.30 (Wriggler) / Lv.155 (Strafer) / Lv.255 (Stomper)\nMedium->Large: Lv.40 / Lv.55 / Lv.220 / Lv.360\nLarge->Behemoth: Lv.80 (Biter/Spitter only)\n\n[Quality Levels]\nFive quality tiers: Normal -> Rare -> Fine -> Epic -> Legendary\nHigher quality = better stat growth, more skill points\n\n[Natural XP Gain]\nWhen hunger >= 60%, pets gain XP every minute\nFormula: 10 + 5% x Magicka\nExample: 400 Magicka -> 30 XP/min\nPet max level = Player level / 2\n\n[Hunger System]\n1. Pets automatically eat fish to restore hunger every minute\n2. Hunger >= 60% required to fight\n3. Without fish, hunger decays based on quality\n\n[Leveling]\n1. Gain skill points on level up, allocate to ATK/HP\n2. Click pet cards to open/close detail panel\n\n[Skill System]\n1. Pets start with a random skill at birth\n2. Buy skill books from shop to teach pets\n3. Using a book on a pet with 3 skills randomly replaces one\n\n[Combat]\n1. Pets auto-deploy when enemies are nearby\n2. Auto-recall 10s after leaving combat\n3. Regenerate 20% max HP per minute after combat\n4. Must heal to 80%+ HP before re-deploying\n\n[Other]\n1. Eat a pet to gain 80% of its accumulated EXP\n2. Transfer player EXP to pets via detail panel

