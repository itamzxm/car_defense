world_name_info_1=旅程的起点，来自五年前的经典地图，地形以山脉为主，其宝藏出现频率是其他地图的1.5倍,且不会被虫子降低伤害。
world_name_info_2=主世界同时拥有4个星球地形，初始基地内有4个1M的大矿，\n同时野外组装机出现频率是其他地图的2倍。
world_name_info_3=岛屿地图，四面环水，利于防守。将汽车布置于水旁边可将汽车升级为捕鱼船。\n【岛屿系统】\n地图上有5种类型的岛屿：军事岛、工业岛、资源岛、科技岛、建筑岛。\n-购买岛屿：花费金币购买岛屿，岛屿会自动生产物品并根据投资比例获得金币和经验\n-升级岛屿：花费金币升级岛屿，增加投资并提高生产效率和收益\n-岛屿循环：岛屿按照军事→工业→资源→科技→建筑的顺序循环生成，确保每种岛屿平均分布
world_name_info_6=防守极其疯狂进攻的虫子，拥有海量经验和金币加成，每25波都会送大量经验和金币，\n同时每15级就能获得一次天赋，汽车内空间是其他世界的2倍并且附带关联箱。\n所有组装机开局就自动启用。但极难建设，虫子进攻凶猛。
world_name_info_7=驾驶蜘蛛穿越5大星球区域躲避虫子追杀，以蜘蛛开局而不是火箭发射井，每个玩家都拥有1个关联箱,主世界带有多个提供无限电力的蓄电池。\n每隔一段距离都会有个补给点，通过放汽车以在主世界和异世界穿越。
world_name_info_8=每90分钟,你和你的基地会被传送到另一个星球，以蜘蛛开局而不是火箭发射井，受限的地图大小，开局就解锁所有商店等级，主世界带有一个提供无限电力的蓄电池。。该地图的虫巢会不断再生。\n通过放汽车以在主世界和异世界穿越。
world_name_info_9=虫子的大军想要通过这个关口，竭尽所能守住他！在关口被突破前虫子只会从上方进攻，城内每隔200米就有非常规律的矿物，非常利于建设。\n但是注意：该地图的虫子会通过发射核弹攻击火箭发射井。
world_name_info_10=统帅你的军队，通过研究科技增加我方军队士气，抵御曹军的进攻。通过击败敌军兵营削弱敌方进攻强度。\n曹军主力只会从上方进攻，但有时也会在我们后面建造军营。
world_name_info_11=你们找到了一座失落之城，这里拥有完善的完善的防线和能量网系统。开局自带防线。能量网有效时，激光塔拥有无限伤害和无限电力，且不会掉血。自主重炮防御系统会自动充能摧毁敌方堡垒。回收箱可以把任何物品转化为能量网中的能量！
world_name_info_12=你们被虫子逼入了三面环水的绝境，爆发了惊人的战斗意志，此地图中开局天赋+1，并且能够通过击杀虫子自动研究科技。在发现港口（研究黄瓶子科技），可解锁新星球地形。
world_name_info_14=开局出生在草星，地球与草星地形互换。开局解锁火箭发射井和太空平台科技，主星每30秒免费填充1个火箭零部件。禁止在太空平台建造石墙！开局仅有鱼、太阳能板、星岩抓取器和破碎机，无武器弹药。
world_name_info_15=十字要塞，四路围攻——纯塔防，不建工厂。击杀虫子赚金币，出生点市场直购机枪/激光/火箭/特斯拉炮塔与装甲模块，只能在中央 256×256 区域布防；炮塔由虚拟能量系统供能，无需自建电网。每 20 波触发全服强化投票（8 张卡池随机抽 3 张，得票最多者永久生效）。科技随波数自动解锁（无需手动研究）：开局前 10 波锁定，之后随波数平滑提升、越战越强。每 100 波 Boss 来袭（可复活、死亡爆炸）；清光四条通道虫巢全员天赋 +1（虫巢随即重铺）。完美波/连击/累计击杀另有金币奖励。坚守 2000 波即胜利，通关获永久初始生命加成。
world_name_info_16=开局在出生点外150米随机生成一座100波强度的敌方堡垒，此后至少每30分钟生成一座（每100波必生成一次，并计入该30分钟间隔，二者共用同一时钟不重复）。虫子固定从堡垒出击进攻玩家，每50波集中进攻一次（其余时间只囤积威胁、不刷虫）。通关后获得移动速度加成（继承自原异次元大逃杀），并计入世界通关挑战（终极奖励所需世界之一）。
world_name_info_17=旷野一片荒芜：没有矿、没有树、没有野外虫巢。所有资源都被封在随机散布的「网格」里——每格净空64×64，外圈两层深水，随机一侧是浅滩（人和车都能通过，是唯一入口）。出生点就是你的家格，内含铁/铜/煤/石4种矿各25万。每格建成时就用地砖标明将产出什么：草地=地球矿，火山岩=方解石/钨/硫酸间歇泉，电磁岩=废料，尤马科土=草星树。格内有3座虫巢和6只沙虫，打光全部虫巢即兑现资源（固体矿100万、原油4井、硫酸泉6井、草星树200-300棵），同时会在格子外侧补刷4座虫巢。越远的格子越可能出稀有资源。堡垒不会落在网格上。开局解锁回收与农业科技，允许填海。通关奖励：跟随机器人数量上限提升。
world_name_info_21=【地形】中央256×256陆地（默认随机矿+中心4块42×42大矿各400万），四周全是岩浆；下方岩浆中随机分布纯单一矿岛（48×48、400万）、全油井岛与市场岛；上方一条352×128通道直通无限火星地形（火山岩），通道两侧是6格宽的黑暗虚空。\n【资源】火星上只有稀疏的方解石（约3万/块）与废料（约20万/块）；出生点传说大矿机+传说红箱，打死任意虫子有3/250概率掉落1个方解石到红箱（矿机无需玩家供电）。\n【市场】野外市场只生成在岩浆中的市场岛上，出生市场固定出售工程基座（500波内100金/500-1500波200金/1500波以上500金）、铸造机（5000金）与传说插件塔（500波前10k/500-1000波20k/1000-2000波50k/2000波后100k）。\n【战斗】虫子只从上方通道南下，火焰塔禁用；堡垒固定3座生成在通道内，需摧毁后核弹发射井才失去保护；无撼地虫。\n【成长】科技价格×1；开局解锁熔融铸造；黄瓶科技后解锁填海；天赋50级+1（关联科技瓶），上限60；除出生点外无白嫖组装机。\n【通关奖励】通关（1500波）后新开图10%概率全员获得1个铸造机，历史最高波数每多500波概率+2%。
world_name_info_19=一个充满石头的狭长峡谷：中间192格正常地型，左右各192格全是密集石头（密度是山谷5倍，石下藏矿，仅在距中心上下1472格内），地图外为不可穿越的黑色虚空，高无限制上下延伸。虫子从上下两个方向来袭，首波延迟3900秒；2000波后每100波波次间隔+2%（最高+30%，3500波封顶）。沿长轴每隔46格自动生成不可摧毁/拆除的精良机器人指令塔（固定一条横向直线，需玩家接电线杆通电后才能使用），构成机器人连接骨架——挖掉两侧石头才能向外扩张基地。天赋：50级+1（RPG玩家等级）；首次研究含绿/灰/蓝/紫/黄/白瓶科技各+1、橙/粉/草瓶各+2、靛瓶+3、黑瓶+5（90k金币池，不计20限购，等同顶尖人才）；本图任意玩家天赋≤60。铁/铜/石/煤/铀400%丰度/分布/大小、石油200%；挖掘速度+200%、背包+20、自动获得精良好运连连；除出生点外无白嫖组装机；黄瓶科技后解锁填海；火焰塔上限1；传说木箱不可用。1500波通关后起始物资+5传说建造机器人，每500波再多+1（所有地图生效）。
world_name_info_13=驾驶火车穿越5大星球区域躲避虫子追杀，以火车开局而不是火箭发射井。\n\n【核心机制】\n- 火车拥有内部空间（车厢）和商店系统\n- 内部空间纵向拼接，每节车厢包含入口、LINK箱子、商店（车头）\n- 关联箱：在主世界放置关联箱，可连接到车厢输入箱，物资自动同步\n- 购买生产力：在商店购买指定物品的生产力，火车将每分钟自动生产\n- 车厢拓展：每购买4种不同生产力的物品，火车增加一节新车厢\n- 油罐车：主世界油罐车与内部存储罐流体自动均分\n\n【地面战利品车厢】\n- 每700米生成一节可连接的战利品车厢\n- 前2节分别固定为货运车厢和油罐车，之后随机\n- 最多控制10节有效车厢，地图上最多3节待连接车厢\n\n【神奇木箱子】\n- 放置传说品质木箱子，选择一种物品，每分钟自动生产\n- 升级：花费1000金币可升级，增加总价值和产量\n- 投资回报率：6%/分钟（每投入1000金币升级，增加6金币/分钟收入）\n- 只能在主世界和火车内部空间放置

