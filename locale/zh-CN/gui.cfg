[gui-description]
spectator_mode=切换缩放至世界视图的噪声效果。\n环境音效将基于地图视图。
auto_hotbar=自动用可放置物品填充你的快捷栏。
notify_on_polls=当新投票创建时接收消息并弹出投票。
position_top=开 = 按钮移回顶栏。\n关 = 按钮在底栏显示。
position_bottom=选择底部按钮放在左侧还是右侧。
position_middle=选择底部按钮放在快捷栏上方还是侧边。
position_portable=选择底部按钮是否便携。
blueprint_library=切换蓝图字符串和蓝图库的使用。
gui_data_cleaning=切换GUI数据清理。
spaghett_mode=禁用物流系统研究。\n不能建造请求箱、被动箱或主动供应箱。
antigrief=切换反恶意功能。
team_balancing=玩家只能加入人数少于或等于对方队伍的队伍。
admin_vote=仅管理员可投票选择地图难度。清除所有现有投票。
inventory_fullness=开 = 启用背包满度。\n关 = 禁用背包满度。
offline_players=开 = 启用离线玩家背包掉落。\n关 = 禁用离线玩家背包掉落。
collapse=开 = 在第100波后启用崩塌。\n关 = 禁用崩塌 - 你必须突破第一个区域才能触发崩塌。
spill_ores=开 = 启用采矿时矿石溢出到地表。\n关 = 禁用采矿时矿石溢出到地表。
void_tiles=开 = 将地块改为地图外。\n关 = 将地块改为 lab-dark-2
market_purchase=开 = 仅允许信任的人购买汽车/坦克。\n关 = 允许所有人购买汽车/坦克。
deconstruct=开 = 允许对汽车/坦克/火车使用拆除。\n关 = 禁止对汽车/坦克/火车使用拆除。
wintery_mode=开 = 启用冬季模式。\n关 = 禁用冬季模式。
# ── 玩家列表 ──
show_all_players=开 = 显示所有玩家（含离线）。\n关 = 仅显示在线玩家。
# ── 投票 ──
poll_create_mode=禁止非信任玩家创建投票。
poll_vote_mode=禁止非信任玩家参与投票。
poll_edit_tooltip=编辑投票
poll_trusted_tooltip=抱歉，你需要成为信任玩家才能创建投票。
poll_duration_tooltip=提示：使用鼠标滚轮或方向键可更精确地控制。
poll_delete_answer_tooltip=删除选项字段
poll_button_tooltip=让你的问题被听到！
poll_needs_question=抱歉，投票需要一个问题。
poll_needs_answer=抱歉，投票至少需要一个选项。
# ── 组 ──
group_name_too_long=组名过长。最多64个字符。
group_desc_too_long=描述过长。最多128个字符。
