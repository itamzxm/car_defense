description=坦克保卫战 - 一款融合RPG成长、天赋系统和12个异次元挑战的硬核生存场景\n\n【核心机制】\n载具即生命：你的载具是移动堡垒，也是唯一的生存希望。当所有玩家的载具都被摧毁时，游戏失败！死亡后会自动传送到载具旁边。\n\n【终极目标】\n征服全部12个世界，挑战4000波虫潮！\n\n【世界特性】\n世界1【山谷】：山地地形，宝藏刷新率1.5倍，虫子伤害不衰减\n世界2【四季】：4种地形同时存在，初始4个100万矿石矿脉，野外组装机刷新率2倍\n世界3【水世界】：岛屿地图，载具放置在深水边自动变成捕鱼船，每30秒收获2条鱼\n世界6【帝国竞技场】：每25波奖励5K金币+200经验，载具空间2倍，含链接箱，所有组装机开局自动激活\n世界7【维度逃脱】：驾驶蜘蛛穿越5个行星区域，开局自带蜘蛛，沿途有补给点\n世界8【维度空间】：每45分钟全员传送到新星球，开局自带蜘蛛，地图有限，所有商店等级开局解锁，虫巢持续刷新\n世界9【雁门关】：虫子只从上方进攻并建造堡垒，会向火箭发射井发射核弹，占领所有野外资源\n世界10【赤壁之战】：指挥你的军队，通过科技研究提升战斗力，摧毁敌方兵营削弱攻击\n世界11【失落之城】：拥有完善的防线和能量网系统，开局自带防线。能量网有效时，激光塔拥有无限伤害和无限电力。自主重炮防御系统会自动充能摧毁敌方堡垒。回收箱可以把任何物品转化为能量！\n世界12【绝境求生】：被虫子逼入三面环水的绝境，开局天赋+1，通过击杀虫子自动研究科技。发现港口后可解锁新星球地形。\n\n【RPG与职业系统】\n四大核心属性：力量（STR）、敏捷（AGI）、魔法（MAG）、活力（VIT）\n三大职业：战士（☆☆☆）、法师（☆☆☆☆☆）、建造者（☆）\n\n【安装说明】\n下载场景文件夹，放置到：%AppData%\\Roaming\\Factorio\\scenarios\\\n启动Factorio → 多人游戏 → 托管存档 → 场景 → 选择坦克保卫战\n\n地图作者：itam\n交流与支持：QQ群701077913


