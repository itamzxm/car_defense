help_title=宠物系统玩法说明
help_text=【宠物获取】\n1. 在商店购买宠物蛋（低/中/高），随机获得不同品质的小型虫子\n2. 法力值首次达到50时，免费获得一只小型近战虫\n3. 每人最多拥有3只宠物\n\n【宠物进化】\n宠物等级达到条件时自动进化为下一形态，仅改变形态，其他属性不变\n进化等级表（按宠物等级）：\n小型→中型：Lv.20（撕咬/喷吐）/ Lv.30（蠕虫）/ Lv.155（游击）/ Lv.255（践踏）\n中型→大型：Lv.40 / Lv.55 / Lv.220 / Lv.360\n大型→巨兽：Lv.80（仅撕咬/喷吐线）\n\n【宠物品质】\n五个品质等级：普通 → 精良 → 稀有 → 史诗 → 传说\n品质越高，属性成长越好，技能点越多\n\n【自然经验获取】\n饥饿≥60%时，宠物每分钟自动获取经验\n经验公式：10 + 5% × 法力值\n例：法力值400 → 每分钟30经验\n宠物等级上限 = 玩家等级 ÷ 2\n\n【饥饿系统】\n1. 宠物每分钟自动吃鱼恢复饥饿值\n2. 饥饿≥60%才能出战\n3. 背包无鱼时，饥饿值按品质衰减\n\n【升级加点】\n1. 升级后获得技能点，可自由分配攻击力/生命值\n2. 重复点击卡片可打开/收起详细面板\n\n【技能系统】\n1. 宠物获得时自带一个随机技能\n2. 可在商店购买技能书给宠物学习\n3. 技能满3个时使用技能书会随机顶替一个\n\n【战斗系统】\n1. 附近有敌人时宠物自动出战\n2. 脱战10秒后自动召回\n3. 脱战后每分钟恢复20%最大生命值\n4. 血量回复到80%以上才能再次出战\n\n【宠物处理】\n1. 吞噬宠物获得80%累积经验\n2. 可将玩家经验分配给宠物

